services:
  - type: web
    name: woodoogifi-bot
    runtime: python
    plan: free
    buildCommand: python -m py_compile main.py && pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.5
